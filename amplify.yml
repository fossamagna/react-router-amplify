version: 1
applications:
  - backend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
        build:
          commands:
            - pwd
            - "ls -al"
            - corepack enable
            - pnpm install --frozen-lockfile
            - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            # Pin the single-root layout so the bin directory does not depend on
            # the installer default (it moved to ~/.local/share/vite-plus/bin) or
            # on XDG_* variables.
            - export VP_HOME="$HOME/.vite-plus"
            - curl -fsSL https://viteplus.dev/install.sh | bash
            - export PATH="$VP_HOME/bin:$PATH"
        build:
          commands:
            - node -v
            - vp run -r pack
            - vp run build
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - "**/*"
      buildPath: examples/todo-app
    appRoot: examples/todo-app
