packages:
  - packages/*
  - examples/*
allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  core-js: true
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 5.0.1
  vite-plus: 0.3.2
  "@vitest/coverage-v8": 5.0.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@types/node": "^22.0.0"
  "@vitest/coverage-v8": "5.0.1"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
