packages:
  - packages/*
  - examples/*
allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  core-js: true
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@types/node": "^26.0.0"
  "@vitest/coverage-v8": "5.0.5"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
